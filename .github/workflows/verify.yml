name: Verify evidence and calculators

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies and upstreams
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/bootstrap_upstreams.py --install-deps
      - name: Run release gates
        run: |
          python scripts/doctor.py
          python -m pytest -q \
            modules/bazi/scripts/test_pai_pan.py \
            scripts/test_audit_ziwei_dataset.py \
            scripts/test_integration.py \
            scripts/test_validate_evidence.py \
            scripts/test_calendar_goldens.py \
            scripts/test_normalize_civil_time.py \
            scripts/test_run_module.py \
            .upstream/Numerologist_skills/qimen-dunjia/scripts/tests/test_qimen_cli.py \
            .upstream/Numerologist_skills/ziwei-doushu/scripts/tests/test_ziwei_cli.py
